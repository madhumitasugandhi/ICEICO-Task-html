<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task-3</title>
    <style>
        body{
            background-color: rgb(53, 52, 52);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            margin: 150px;
            height: 500px;
            width: 70%;
            background-color: rgb(47, 47, 48);
            border-radius: 10px;
        }
        .name{
            font-size: 30px;
            text-align: center;
            padding-top: 15px;
            margin: 15px;
            
        }
        input{
            margin-top: 10px;
            margin-left: 7%;
            width: 85%;
            height: 15px;
        }
        button{
            margin-top: 5px;
            margin-left: 45%;
            cursor: pointer;
        }
        .box{
            margin-left: 10%;
            margin-top: 11px;
            padding: 15px;
            height: 70px;
            width: 75%;
            border:none;
            border-radius: 5px;
            font-size: 20px;
        }
        p{
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="name">Weight Converter</div>
        <input placeholder="Enter Weight"><br/>
        <button type="submit">Go</button>
        <div class="box" style="background-color: rgb(71, 71, 243);">
            Pounds:<p>112.44</p>
        </div>
        <div class="box" style="background-color:rgb(66, 155, 66);">
            Ounces:
            <p>1798.97</p>
        </div>
        <div class="box"style="background-color: tomato;">
            Grams:<p>51000</p>
        </div>
    </div>
</body>
</html>
