<!DOCTYPE html>
<html>
<head>
<style> 
.container{
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 300px;
    justify-content: space-evenly;
    margin: 100px auto;
    background-image: url(https://images.pexels.com/photos/3214110/pexels-photo-3214110.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1);
    background-size: cover;
}
.div1 {
  width: 100px;
  height: 100px;
  background-color: rgb(2, 77, 2);
  border: 1px solid black;
  margin: 100px auto;
  border-radius: 12px;
  transform: translate(0px,0px);
}
.div1:hover{
 transform: translate(0px,50px);
 transition:2s;
 background-color: rgb(13, 204, 13);
 }
 .div2 {
  width: 100px;
  height: 100px;
  margin: 100px auto;
  background-color: palevioletred;
  border: 1px solid black;
  border-radius: 12px;
  transform: translate(0px,0px);
}
.div2:hover{
 
 transform: rotate(90deg);
 transition:2s;
 background-color: red;
 }
 .div3 {
  width: 100px;
  height: 100px;
  margin: 100px auto;
  background-color: rgb(69, 69, 189);
  border: 1px solid black;
  border-radius: 12px;
  transform: translate(0px,0px);
}
.div3:hover{
 transform: translate(50px,0px);
 transition:2s;
 background-color: rgb(154, 154, 247);
 }
 
</style>
</head>
<body>
    <P>Wlcome </P>
<div class="container">
    <div class="div1">

    </div>
    <div class="div2">

    </div>
    <div class="div3">

    </div>
</div>




</body>
</html>
