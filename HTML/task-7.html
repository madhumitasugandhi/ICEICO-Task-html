<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task-7</title>
    <style>
        body{
            box-sizing: border-box;
        }
        .container{
            display: grid;
            gap: 10px;
            padding: 10px 0px;
            grid-template-columns: repeat(6, 1fr);
        }
       .container > div{
        background-color: rgb(78, 19, 240);
        border: none;
        padding: 71px;
        text-align: center;

       }
       .a{
            grid-row: 1;
            grid-column: 1/ span 2;
        }
        .b{
            grid-row: 1;
            grid-column: 3/ span 2;
        }
        .c{
            grid-row: 1;
            grid-column: 5/ span 2;
        }
        .d{
            grid-row: 2;
            grid-column: 1/ span 6;
        }
        .e{
            grid-row: 3;
            grid-column: 1/ span 3;
        }
        .f{
            grid-row: 3;
            grid-column: 4/ span 3;
        }
        .g{
            grid-row: 4;
            grid-column: 1/ span 4;
        }
        .h{
           
        }
        .i{
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="a">
            .col-4
        </div>
        <div class="b">
            .col-4
        </div>
        <div class="c">
            .col-4
        </div>
        <div class="d">
            .col-12
        </div>
        <div class="e">
            .col-6
        </div>
        <div class="f">
            .col-6
        </div>
        <div class="g">
            .col-8
        </div>
        <div class="h">
            .col-2
        </div>
        <div class="i">
            .col-2
        </div>
    </div>
</body>
</html>
