<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task-6</title>
    <style>
        body{
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-rows:repeat(6, 1fr) ;
            grid-template-columns:repeat(12, 1fr) ;

            gap: 10px;
            padding: 10px 0px;
        }
        .container > div{
            background-color: darkblue;
            border: none;
            text-align: center;
            padding: 100px;
            color: white;
        }
        .a{
            grid-column: 1/span 6;
            grid-row: 1/span 14;
        }
        .b{ 
            grid-column: 7/span 3;
            grid-row: 1/span 5;
        }
        .c{
            grid-column: 7/span 3;
            grid-row: 6/span 9;
        }
        .d{
            grid-column: 10/span 4;
            grid-row: 1/span 3;
        }
        .e{
            grid-column: 10/span 4;
            grid-row: 4/span 4;
        }
        .f{
            grid-column: 10/span 4;
            grid-row: 8/span 7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="a">
            1<sup>st</sup>
        </div>
        <div class="b">
            2<sup>nd</sup>
        </div>
        <div class="c">
            3<sup>rd</sup>
        </div>
        <div class="d">
            4<sup>th</sup>
        </div>
        <div class="e">
            5<sup>th</sup>
        </div>
        <div class="f">
            6<sup>th</sup>
        </div>
    </div>
</body>
</html>
